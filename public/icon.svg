<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="snakeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="foodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="100" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.2"/>

  <!-- Subtle Grid Lines -->
  <path d="M64 128 h384 M64 192 h384 M64 256 h384 M64 320 h384 M64 384 h384" stroke="#1e293b" stroke-width="2" stroke-dasharray="4,6" opacity="0.6"/>
  <path d="M128 64 v384 M192 64 v384 M256 64 v384 M320 64 v384 M384 64 v384" stroke="#1e293b" stroke-width="2" stroke-dasharray="4,6" opacity="0.6"/>

  <!-- Snake Body Segments (Turtle style) -->
  <rect x="148" y="276" width="48" height="48" rx="12" fill="#047857" opacity="0.9"/>
  <rect x="148" y="212" width="48" height="48" rx="12" fill="#059669"/>
  <rect x="212" y="212" width="48" height="48" rx="12" fill="#10b981"/>
  <rect x="276" y="212" width="48" height="48" rx="12" fill="#10b981"/>
  <rect x="276" y="148" width="48" height="48" rx="12" fill="#34d399"/>

  <!-- Snake Head (Turtle shape with direction) -->
  <g filter="url(#glow)">
    <rect x="340" y="148" width="56" height="48" rx="14" fill="url(#snakeGrad)"/>
    <!-- Turtle eyes -->
    <circle cx="376" cy="160" r="5" fill="#020617"/>
    <circle cx="378" cy="159" r="1.5" fill="#ffffff"/>
    <circle cx="376" cy="184" r="5" fill="#020617"/>
    <circle cx="378" cy="183" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Red Food Apple Target -->
  <circle cx="368" cy="300" r="22" fill="url(#foodGrad)" filter="url(#glow)"/>
  <circle cx="362" cy="294" r="5" fill="#ffffff" opacity="0.6"/>
  <!-- Leaf -->
  <path d="M368 280 Q374 270 382 272 Q378 280 368 280 Z" fill="#22c55e"/>

  <!-- Python Prompt Emblem / Badge -->
  <g transform="translate(64, 400)">
    <rect width="180" height="44" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="18" y="28" fill="#34d399" font-family="monospace" font-size="20" font-weight="bold">&gt;&gt;&gt; turtle</text>
  </g>
</svg>
